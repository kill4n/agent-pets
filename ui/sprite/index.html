<!doctype html>
<html><head><meta charset="utf-8"><title>buddy sprite</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;height:100%}
  /* the window may be wider than the sprite (room for the tooltip): centre the canvas */
  body{display:flex;justify-content:center;align-items:flex-start}
  #c{display:block;flex:none;image-rendering:pixelated;cursor:grab}
  #tip{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;width:max-content;max-width:calc(100% - 8px);
       box-sizing:border-box;background:rgba(20,20,30,.9);color:#eee;font:11px/1.35 system-ui;padding:4px 7px;
       border-radius:6px;white-space:normal;overflow-wrap:anywhere;text-align:center;display:none;pointer-events:none}
  #tip.show{display:block}
</style></head>
<body><canvas id="c"></canvas><div id="tip"></div><script type="module" src="./main.ts"></script></body></html>
