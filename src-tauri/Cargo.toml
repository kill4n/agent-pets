[package]
name = "buddy"
version = "0.1.0"
edition = "2021"

[lib]
name = "buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
axum = "0.8"
directories = "6"
hostname = "0.4"
rand = "0.9"
png = "0.17"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
